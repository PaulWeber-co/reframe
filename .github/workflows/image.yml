name: Image

# Builds the container image for amd64 and arm64 and pushes it to GitHub's
# container registry: on every push to main as "edge", and on a version tag
# (v0.1.0) as that version and "latest". A tag then also pins the Umbrel apps to
# the image and creates the GitHub release: see RELEASING.md.
on:
  push:
    branches: [main]
    # A change to the docs alone needs no new image (tags always build)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "media/**"
      - ".github/ISSUE_TEMPLATE/**"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reframe
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build the amd64 image and start it once
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: reframe:ci
      - name: The server answers
        run: |
          docker run -d --name reframe-ci -p 7777:7777 -e REFRAME_DEMO=1 reframe:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7777/api/state -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:7777/api/state | head -c 200
          docker rm -f reframe-ci
      - name: Push both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After a tag: point the Umbrel apps at the exact image that was just built.
  # The commit says [skip ci] so it does not start another build.
  pin-umbrel:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin both apps to the new image
        run: scripts/pin-umbrel-image.sh "${GITHUB_REF_NAME#v}"
      - name: Commit the pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reframe-dashboard reframe-display
          if git diff --cached --quiet; then
            echo "nothing to pin: already up to date"
          else
            git commit -m "Pin the Umbrel apps to ${GITHUB_REF_NAME} [skip ci]"
            git push origin HEAD:main
          fi

  release:
    needs: pin-umbrel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The changelog section of this version becomes the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v " " { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "Reframe $version" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
