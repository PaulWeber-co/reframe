name: Image

# Builds the container image for amd64 and arm64 and pushes it to GitHub's
# container registry: on every push to main as "edge", on a version tag
# (v0.1.0) as that version and "latest".
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reframe
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build the amd64 image and start it once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: reframe:ci
      - name: The server answers
        run: |
          docker run -d --name reframe-ci -p 7777:7777 -e REFRAME_DEMO=1 reframe:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7777/api/state -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:7777/api/state | head -c 200
          docker rm -f reframe-ci
      - name: Push both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
