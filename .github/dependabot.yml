version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Stay on the long-term-support Node line; move up by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
