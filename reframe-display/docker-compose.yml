version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: reframe-display_web_1
      APP_PORT: 7777

  web:
    image: ghcr.io/paulweber-co/reframe:0.1.0
    restart: on-failure
    volumes:
      # The entrypoint takes care of the folders' owner, so a fresh install just works
      - ${APP_DATA_DIR}/data/config:/data
      - ${APP_DATA_DIR}/data/media:/media
      - ${APP_DATA_DIR}/data/run:/run/reframe
      - ${APP_DATA_DIR}/data/airplay:/run/shairport-sync:ro
    environment:
      REFRAME_ALLOWED_HOSTS: ${DEVICE_DOMAIN_NAME}
    security_opt:
      - no-new-privileges:true

  # Chromium full screen on this machine's display. No privileged mode and no
  # extra capabilities: the graphics card (/dev/dri) comes from the GPU
  # permission in umbrel-app.yml, the input devices are mapped here, and the udev
  # database is read-only. cage runs without a seat daemon (the "noop" seat).
  # It shares the dashboard's network, so the page loads from 127.0.0.1.
  # Brightness is dimmed in the page.
  kiosk:
    image: ghcr.io/paulweber-co/reframe:0.1.0
    command: kiosk
    restart: on-failure
    network_mode: "service:web"
    depends_on:
      - web
    environment:
      REFRAME_KIOSK_SEAT: noop
    devices:
      - /dev/input:/dev/input
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data/config:/data
      - ${APP_DATA_DIR}/data/run:/run/reframe
      - /run/udev:/run/udev:ro

  # AirPlay 2 speaker. Needs the host network for discovery (multicast) and
  # uses the machine's avahi-daemon, which umbrelOS runs.
  airplay:
    image: mikebrady/shairport-sync:5.5.2
    restart: on-failure
    network_mode: host
    cap_add:
      - SYS_NICE
    devices:
      - /dev/snd:/dev/snd
    environment:
      ENABLE_AVAHI: "0"
    volumes:
      - ${APP_DATA_DIR}/data/airplay:/run/shairport-sync
      - ${APP_DATA_DIR}/shairport-sync.conf:/etc/shairport-sync.conf:ro
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
