// The AirPlay 2 receiver of Reframe. Title, artist, cover and progress go into
// a named pipe that the dashboard reads (app/server/sources/shairport.js).
// Rename the speaker here: it is the name phones show.
general =
{
  name = "Reframe";
  output_backend = "alsa";
};

alsa =
{
  output_device = "default";
};

metadata =
{
  enabled = "yes";
  include_cover_art = "yes";
  cover_art_cache_directory = "";
  pipe_name = "/run/shairport-sync/metadata";
  pipe_timeout = 5000;
  progress_interval = 1.0;
};
